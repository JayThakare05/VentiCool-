<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Video — VentiCool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ============ CORE VARIABLES ============ */
    :root {
      --bg-dark: #0a1628;
      --pure-white: #ffffff;
      --text-muted: #94a3b8;
      
      /* Cool Conclave Palette */
      --teal-dark: #0f2847;
      --teal: #0ea5c0;
      --teal-light: #3dd8f0;
      --accent-green: #25b481;
      --accent-lime: #87d68d;
      
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(14, 165, 192, 0.15);
      --shadow-glow: 0 0 60px rgba(14, 165, 192, 0.15);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--bg-dark);
      color: var(--pure-white);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ============ BACKGROUND EFFECTS ============ */
    .bg-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0; overflow: hidden; pointer-events: none;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(100px);
      opacity: 0.4; mix-blend-mode: screen;
      animation: float 12s ease-in-out infinite alternate;
    }
    .orb-1 { width: 50vw; height: 50vw; background: var(--teal-dark); top: -20%; left: -10%; }
    .orb-2 { width: 40vw; height: 40vw; background: rgba(37,180,129,0.15); bottom: -10%; right: -10%; animation-delay: -4s; }
    
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -40px) scale(1.05); }
      50% { transform: translate(-20px, 20px) scale(0.95); }
      75% { transform: translate(40px, 30px) scale(1.02); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* Grid overlay for texture */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(14, 165, 192, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14, 165, 192, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    }

    /* ============ NAVBAR ============ */
    .navbar {
      position: fixed; top: 0; left: 0; width: 100%;
      padding: 20px 40px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 100;
      background: rgba(10, 22, 40, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
    }
    .nav-brand {
      display: flex; align-items: center; gap: 12px;
      text-decoration: none; color: var(--pure-white);
    }
    .nav-brand-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--teal), var(--accent-green));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.2rem;
    }
    .nav-brand-text {
      font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.2rem;
      letter-spacing: 1px;
    }
    .nav-brand-text span { color: var(--teal-light); }
    
    .nav-back {
      display: flex; align-items: center; gap: 8px;
      color: var(--text-muted); text-decoration: none;
      font-size: 0.95rem; font-weight: 500;
      transition: color 0.3s;
    }
    .nav-back svg {
      width: 18px; height: 18px; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none;
    }
    .nav-back:hover { color: var(--teal-light); }

    /* ============ MAIN VIDEO SECTION ============ */
    .video-section {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 80px;
    }

    .section-header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeSlideUp 0.8s ease-out both;
    }
    
    .section-label {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 12px;
    }

    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--pure-white), var(--teal-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }

    .section-desc {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .decor-line {
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, var(--teal), var(--accent-green));
      border-radius: 2px;
      margin: 0 auto 24px;
    }

    .video-container {
      width: 100%;
      max-width: 1100px;
      position: relative;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), var(--shadow-glow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: fadeSlideUp 1s ease-out 0.2s both;
      transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
    }
    
    .video-container:hover {
      transform: translateY(-8px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 80px rgba(14, 165, 192, 0.25);
      border-color: rgba(14, 165, 192, 0.35);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    .video-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      outline: none;
    }

    /* Glow behind the video container */
    .video-container::before {
      content: '';
      position: absolute;
      inset: -10px;
      background: linear-gradient(135deg, var(--teal), var(--accent-green));
      filter: blur(40px);
      opacity: 0.15;
      border-radius: inherit;
      z-index: -1;
      transition: opacity 0.4s ease;
    }

    .video-container:hover::before {
      opacity: 0.25;
    }

    /* ============ ANIMATIONS ============ */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 768px) {
      .navbar { padding: 16px 20px; }
      .video-section { padding: 100px 16px 60px; }
      .nav-brand-text { font-size: 1.1rem; }
      .section-title { font-size: 2.2rem; }
      .video-container { padding: 10px; border-radius: 16px; }
      .video-wrapper { border-radius: 10px; }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <a href="/" class="nav-brand">
      <div class="nav-brand-icon">V</div>
      <div class="nav-brand-text">Venti<span>Cool</span></div>
    </a>
    <a href="/" class="nav-back">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span>Back to Home</span>
    </a>
  </nav>

  <!-- Video Section -->
  <main class="video-section">
    <div class="section-header">
      <div class="section-label">Showcase</div>
      <h1 class="section-title">Experience VentiCool</h1>
      <div class="decor-line"></div>
      <p class="section-desc">Watch our venturi-driven evaporative cooling system in action. Discover how we achieve cooler, drier air sustainably.</p>
    </div>

    <div class="video-container">
      <div class="video-wrapper">
        <video controls autoplay muted loop playsinline>
          <source src="video/Demo.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </div>
  </main>

</body>
</html>
